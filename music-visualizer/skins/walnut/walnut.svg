<svg xmlns="http://www.w3.org/2000/svg" width="360" height="200" viewBox="0 0 360 200">
  <!-- Walnut veneer: long horizontal grain from stretched noise, drawn as dark streaks over a warm base. -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.008 0.16" numOctaves="3" seed="11" />
    <feColorMatrix type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.05  0 0 0 0 0.01  1.4 0 0 0 -0.55" />
  </filter>
  <rect width="360" height="200" fill="#5a3216" />
  <rect width="360" height="200" filter="url(#grain)" />
</svg>
